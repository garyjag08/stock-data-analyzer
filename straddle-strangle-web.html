<html>
<head>
    <script>
        function fetchData(){
            alert("getting data from PhP file");
        // Fetch data from the API
        fetch('https://www.accountplusfinance.com/test-development/test-api.php')
            .then(response => {
                // Check if the response is OK (status code 200)
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                // Parse the response body as JSON
                return response.json();
            })
            .then(data => {
                // Log the parsed JSON data to the console
                console.log(data);

                // Access specific parts of the JSON data
                const price = data.price;
                const message = data.recommendation;
                const name = data.stock;


                // Display the data on the webpage
                const container = document.getElementById('data-container');
                container.innerHTML = `
                    <p><strong>Status:</strong> ${price}</p>
                    <p><strong>Message:</strong> ${message}</p>
                    <p><strong>Name:</strong> ${name}</p>
                `;
            })
            .catch(error => {
                // Handle any errors (network issues, bad response, etc.)
                console.error('There was a problem with the fetch operation:', error);
                const container = document.getElementById('data-container');
                container.innerHTML = '<p>Failed to load data awwww snap.</p>';
            });
        }
    </script>
  
</head>

<body>
      <h1>Flask API Example</h1>
    <button onclick="fetchData()">Get API Data</button>
    <div id="apiData"></div>


</body>
</html>
