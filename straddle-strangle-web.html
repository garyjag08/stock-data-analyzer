<html>
<head>
    <script>
        alert("hello world - fetch data"); 
        function fetchData() {
            fetch('https://stocks.accountplusfinance.com/sample-api-testing')  // Replace with your Flask API URL
                .then(response => response.json())
                .then(data => {
                    // Display the message from Flask API in the <p> element
                    document.getElementById('apiData').innerText = data.message;
                })
                .catch(error => console.error('Error fetching data:', error));
        }
    </script>
  
</head>

<body>
      <h1>Flask API Example</h1>
    <button onclick="fetchData()">Fetch Data</button>
    <div id="apiData"></div>


</body>
</html>
